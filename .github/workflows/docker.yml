name: docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: repo
        run: |
          echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ steps.repo.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Boot image against dead backend
        run: |
          set -eu
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          img="ghcr.io/${repo}:sha-${GITHUB_SHA::7}"
          docker pull "$img"
          docker run -d --name smoke -p 8443:443 \
            -e CERTMATE_URL=http://127.0.0.1:9 \
            -e CERTMATE_DOMAINS=example.com \
            -e CERTMATE_API_TOKEN=test-token \
            "$img"
          trap 'docker rm -f smoke >/dev/null' EXIT
          sleep 15
          docker exec smoke nginx -t
          test "$(docker inspect -f '{{.State.Running}}' smoke)" = "true"
          docker exec smoke grep -cE '\[emerg\]|\[alert\]|\[crit\]' \
            /var/log/nginx/error.log | grep -qx 0
          echo "smoke OK: container runs, config valid, log clean"
