load_module modules/ngx_http_auto_ssl_module.so;

worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;

    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path /var/cache/nginx/proxy_temp;
    fastcgi_temp_path /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path /var/cache/nginx/uwsgi_temp;
    scgi_temp_path /var/cache/nginx/scgi_temp;

    # Cache tuning: serve cached certs while the backend is slow/down.
    auto_ssl_cache_ttl 1d;
    auto_ssl_cache_refresh_interval 1m;
    auto_ssl_cache_max_stale 7d;
    auto_ssl_cache_negative_ttl 1m;
    auto_ssl_cache_expiry_interval 1h;
    auto_ssl_cache_expiry_before 24h;

    include /etc/nginx/conf.d/*.conf;
}
